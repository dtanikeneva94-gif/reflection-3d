<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// === Scene setup ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1520); // cooler dusk blue
scene.fog = new THREE.Fog(0x1a2530, 12, 40); // denser atmospheric fog

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 4, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 6;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI / 2.1;

// === Lighting ===
const ambient = new THREE.AmbientLight(0xb8c4d0, 0.25); // cooler ambient for snow
scene.add(ambient);

const mainLight = new THREE.DirectionalLight(0xff8c42, 0.8); // stronger warm sunset light
mainLight.position.set(8, 12, 6);
mainLight.castShadow = true;
mainLight.shadow.mapSize.set(2048, 2048);
scene.add(mainLight);
const fillLight = new THREE.DirectionalLight(0xa0c0e0, 0.3);
fillLight.position.set(-5, 8, -3);
scene.add(fillLight);


// Warm lantern lights
function createLantern(x, y, z, color = 0xff6b1a, intensity = 2.2) {
  const light = new THREE.PointLight(color, intensity, 12, 1.5);
  light.position.set(x, y, z);
  light.castShadow = true;
  scene.add(light);

  // Visual lantern body
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.2, 0.6, 8),
    new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.7, metalness: 0.3 })
  );
  body.position.copy(light.position);
  body.castShadow = true;
  scene.add(body);

  const glow = new THREE.PointLight(color, 0.8, 4);
  glow.position.copy(light.position);
  scene.add(glow);

  return { light, body };
}

const lanterns = [
  createLantern(-6, 2.5, -4),
  createLantern(6, 2.5, -4),
  createLantern(-4, 1.8, 5),
  createLantern(4, 1.8, 5),
];

// Flicker effect
function flickerLights(time) {
  lanterns.forEach((l, i) => {
    const flicker = 0.85 + Math.sin(time * 3 + i * 2) * 0.1 + Math.random() * 0.05;
    l.light.intensity = 2.2 * flicker;
  });
}

// === Trees (pine trees for winter station) ===
function createPineTree(x, z, scale = 1) {
  const tree = new THREE.Group();

  // Trunk
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12 * scale, 0.18 * scale, 1.8 * scale, 8),
    new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.9 })
  );
  trunk.position.y = 0.9 * scale;
  trunk.castShadow = true;
  tree.add(trunk);

  // Foliage layers (cones)
  const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1e4a2e, roughness: 0.8 });
  for (let i = 0; i < 3; i++) {
    const height = (1.6 - i * 0.35) * scale;
    const radius = (0.9 - i * 0.2) * scale;
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(radius, height, 8),
      foliageMat
    );
    cone.position.y = (1.6 + i * 0.7) * scale;
    cone.castShadow = true;
    tree.add(cone);

    // Light snow on top of foliage
    const snowCap = new THREE.Mesh(
      new THREE.ConeGeometry(radius * 0.85, 0.25 * scale, 8),
      new THREE.MeshStandardMaterial({ color: 0xf5f8ff, roughness: 0.6 })
    );
    snowCap.position.y = cone.position.y + height * 0.35;
    tree.add(snowCap);
  }

  tree.position.set(x, 0, z);
  return tree;
}

function createEnvelopeTexture(q) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 360;
  const ctx = canvas.getContext('2d');

  // Parchment background
  const grad = ctx.createLinearGradient(0, 0, 512, 360);
  grad.addColorStop(0, '#f4e8d0');
  grad.addColorStop(0.5, '#e8d5b0');
  grad.addColorStop(1, '#dcc8a0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 360);

  // Border
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 8;
  ctx.strokeRect(12, 12, 488, 336);

  // Number
  ctx.fillStyle = '#5c2e0a';
  ctx.font = 'bold 72px Georgia';
  ctx.textAlign = 'left';
  ctx.fillText(q.num, 40, 90);

  // Icon area (simple circle)
  ctx.beginPath();
  ctx.arc(400, 80, 40, 0, Math.PI * 2);
  ctx.fillStyle = '#6b3e1a';
  ctx.fill();
  ctx.fillStyle = '#f4e4c1';
  ctx.font = '40px serif';
  ctx.textAlign = 'center';
  ctx.fillText(q.icon, 400, 92);

  // Question text
  ctx.fillStyle = '#3a2a1a';
  ctx.font = 'bold 28px Georgia';
  ctx.textAlign = 'center';
  const lines = q.text.split('\n');
  lines.forEach((line, i) => {
    ctx.fillText(line, 256, 180 + i * 40);
  });

  // Wax seal suggestion
  ctx.beginPath();
  ctx.arc(256, 310, 28, 0, Math.PI * 2);
  ctx.fillStyle = '#8b1a1a';
  ctx.fill();

  const texture = new THREE.CanvasTexture(canvas);
  texture.anisotropy = 8;
  return texture;
}

  const mesh = new THREE.Mesh(envelopeGeo, mat);

    Math.sin(angle) * radius,
    1.2,

  );
  mesh.rotation.y = angle + Math.PI;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { index: i, question: q };

  carousel.add(mesh);

});

function createSnowflakeTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 64, 64);
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  // Simple 6-point snowflake
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    ctx.moveTo(32, 32);
    ctx.lineTo(32 + Math.cos(a) * 28, 32 + Math.sin(a) * 28);
  }
  ctx.stroke();
  // Small center
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(32, 32, 2.5, 0, Math.PI * 2);
  ctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const flakeTex = createSnowflakeTexture();

const snowWind = [];

  snowPositions[i * 3 + 1] = Math.random() * 28 + 1;

for (let i = 0; i < fineSnowCount; i++) {

}

const clock = new THREE.Clock();
let autoRotate = true;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (autoRotate) {
    carousel.rotation.y += 0.003;
  }

  // Gentle bobbing of envelopes
  envelopes.forEach((env, i) => {
    env.position.y = 1.2 + Math.sin(t * 1.2 + i) * 0.08;
  });

  // Animate particles (embers)
  const pos = particles.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    pos[i * 3 + 1] += 0.01;
    if (pos[i * 3 + 1] > 8) pos[i * 3 + 1] = 0.5;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  // Animate realistic snow
  const snowPos = snow.geometry.attributes.position.array;
  for (let i = 0; i < snowCount; i++) {
    snowPos[i * 3 + 1] -= snowVelocities[i];
    snowPos[i * 3]     += snowWind[i] + Math.sin(t * 0.35 + i * 0.07) * 0.003;
    snowPos[i * 3 + 2] += Math.cos(t * 0.25 + i * 0.04) * 0.0015;
    if (snowPos[i * 3 + 1] < -0.5) {
      snowPos[i * 3 + 1] = 26 + Math.random() * 5;
      snowPos[i * 3]     = (Math.random() - 0.5) * 55;
      snowPos[i * 3 + 2] = (Math.random() - 0.5) * 55;
    }
  }
  snow.geometry.attributes.position.needsUpdate = true;

  // Animate fine snow
  const finePosArr = fineSnow.geometry.attributes.position.array;
  for (let i = 0; i < fineSnowCount; i++) {
    finePosArr[i * 3 + 1] -= fineVel[i];
    finePosArr[i * 3]     += fineWind[i] + Math.sin(t * 0.18 + i * 0.03) * 0.001;
    if (finePosArr[i * 3 + 1] < -0.5) {
      finePosArr[i * 3 + 1] = 30 + Math.random() * 6;
      finePosArr[i * 3]     = (Math.random() - 0.5) * 70;
      finePosArr[i * 3 + 2] = (Math.random() - 0.5) * 70;
    }
  }
  fineSnow.geometry.attributes.position.needsUpdate = true;

  flickerLights(t);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Pause auto-rotate when user interacts
controls.addEventListener('start', () => autoRotate = false);

  setTimeout(() => autoRotate = true, 3000);
});

// Raycaster for clicking envelopes
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(envelopes);
  if (hits.length > 0) {
    const env = hits[0].object;
    const q = env.userData.question;
    document.getElementById('info').innerHTML = 
      `<strong>Конверт ${q.num}</strong><br>${q.text.replace(/\n/g, '<br>')}`;
    // Highlight
    env.scale.set(1.15, 1.15, 1.15);
    setTimeout(() => env.scale.set(1, 1, 1), 600);
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
